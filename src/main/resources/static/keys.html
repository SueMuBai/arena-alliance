<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 Key · Arena 联盟</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .privacy-options { display: grid; gap: 7px; min-width: 180px; }
    .privacy-options label { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; cursor: pointer; }
    .privacy-options input { margin: 0; }
  </style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="page">
  <div class="card">
    <h2>上传游戏 apikey <small>把你的 Arena Hero Agent API Key 交给联盟托管，即可加入联盟地图与保护体系；一个账号可上传多个 key（多个游戏账号）</small></h2>
    <label class="field">
      <span class="lab">API Key（仅加密存储，绝不回显明文）</span>
      <input type="password" id="key-token" placeholder="粘贴 Arena Hero API Key" autocomplete="off">
    </label>
    <label class="field">
      <span class="lab">备注（可选）</span>
      <input type="text" id="key-label" placeholder="例如：大号 / 小号2" maxlength="60">
    </label>
    <button class="btn primary" id="btn-add">上传并接入</button>
  </div>

  <div class="card">
    <h2>我的 Key 列表</h2>
    <table>
      <thead>
      <tr>
        <th>游戏账号</th>
        <th>备注</th>
        <th>Key</th>
        <th>状态</th>
        <th>最近 Tick</th>
        <th>说明</th>
        <th>隐私设置</th>
        <th style="width:180px">操作</th>
      </tr>
      </thead>
      <tbody id="key-rows"></tbody>
    </table>
    <div id="key-empty" style="display:none;color:var(--dim);text-align:center;padding:28px">
      还没有上传任何 key
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
  (async function () {
    let me;
    try { me = await ensureLogin(); } catch (e) { return; }
    renderTopbar('keys', me);
    if (new URLSearchParams(location.search).get('required') === 'map') {
      toast('请先上传一个游戏 Key，再访问联盟地图', true);
    }
    try {
      const cfg = await api('/api/auth/config');
      setAllianceName(cfg.allianceName);
      document.title = '我的 Key · ' + cfg.allianceName;
    } catch (e) { }

    const STATUS_MAP = {
      ENABLED: ['已启用', 'on'], DISABLED: ['已停用', ''],
      INVALID: ['凭证失效', 'err'], DUPLICATE: ['重复账号', 'warn']
    };

    async function refresh() {
      const keys = await api('/api/keys');
      const rows = $id('key-rows');
      $id('key-empty').style.display = keys.length ? 'none' : 'block';
      rows.innerHTML = keys.map(k => {
        const st = STATUS_MAP[k.status] || [k.status, ''];
        const online = k.status === 'ENABLED'
          ? `<span class="dot ${k.online ? 'on' : 'off'}"></span>` : '';
        const toggle = k.status === 'ENABLED'
          ? `<button class="btn sm" data-act="disable" data-id="${k.id}">停用</button>`
          : `<button class="btn sm" data-act="enable" data-id="${k.id}">启用</button>`;
        return `<tr data-key-id="${k.id}">
          <td>${k.gameUsername ? '@' + esc(k.gameUsername) : '<span style="color:var(--dim)">识别中…</span>'}</td>
          <td>${esc(k.label || '')}</td>
          <td style="font-family:monospace">${esc(k.masked)}</td>
          <td>${online}<span class="status-pill ${st[1]}">${st[0]}</span></td>
          <td>${k.lastSeenTick ?? '-'}</td>
          <td style="color:var(--dim);font-size:12px">${esc(k.lastError || '')}</td>
          <td><div class="privacy-options">
            <label><input type="checkbox" data-privacy="showCoreOnMap" ${k.showCoreOnMap ? 'checked' : ''}>向其他成员显示核心</label>
            <label><input type="checkbox" data-privacy="rosterIdsOnly" ${k.rosterIdsOnly ? 'checked' : ''}>盟友接口仅返回对象 ID</label>
          </div></td>
          <td>${toggle}
              <button class="btn sm danger" data-act="del" data-id="${k.id}">删除</button></td>
        </tr>`;
      }).join('');
      rows.querySelectorAll('button').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.id, act = btn.dataset.act;
          try {
            if (act === 'del') {
              if (!confirm('确定删除该 key？')) return;
              await api('/api/keys/' + id, { method: 'DELETE' });
            } else {
              await api('/api/keys/' + id + '/' + act, { method: 'POST' });
            }
            toast('操作成功');
            refresh();
          } catch (e) {
            toast(e.message, true);
          }
        };
      });
      rows.querySelectorAll('input[data-privacy]').forEach(input => {
        input.onchange = async () => {
          const row = input.closest('tr');
          const toggles = row.querySelectorAll('input[data-privacy]');
          const payload = {};
          toggles.forEach(toggle => {
            payload[toggle.dataset.privacy] = toggle.checked;
            toggle.disabled = true;
          });
          try {
            await api('/api/keys/' + row.dataset.keyId + '/privacy', {
              method: 'POST', body: JSON.stringify(payload)
            });
            toast('隐私设置已更新');
          } catch (e) {
            toast(e.message, true);
          }
          await refresh();
        };
      });
    }

    $id('btn-add').onclick = async () => {
      const token = $id('key-token').value.trim();
      if (!token) { toast('请粘贴 apikey', true); return; }
      $id('btn-add').disabled = true;
      try {
        await api('/api/keys', {
          method: 'POST',
          body: JSON.stringify({ token, label: $id('key-label').value.trim() })
        });
        $id('key-token').value = '';
        $id('key-label').value = '';
        toast('已上传，正在接入游戏…');
        refresh();
      } catch (e) {
        toast(e.message, true);
      } finally {
        $id('btn-add').disabled = false;
      }
    };

    await refresh();
    setInterval(refresh, 8000);
  })();
</script>
</body>
</html>
