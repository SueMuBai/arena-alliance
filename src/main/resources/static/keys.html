<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 Key · Arena 联盟</title>
  <link rel="stylesheet" href="/css/app.css?v=terrain-v1">
  <style>
    .privacy-options { display: grid; gap: 7px; min-width: 180px; }
    .privacy-options label { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; cursor: pointer; }
    .privacy-options input { margin: 0; }
    [v-cloak] { display: none; }
  </style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="page" id="app" v-cloak>
  <div class="card">
    <h2>上传游戏 apikey <small>把你的 Arena Hero Agent API Key 交给联盟托管，即可加入联盟地图与保护体系；一个账号可上传多个 key（多个游戏账号）</small></h2>
    <label class="field">
      <span class="lab">API Key（仅加密存储，绝不回显明文）</span>
      <input type="password" v-model="form.token" placeholder="粘贴 Arena Hero API Key" autocomplete="off"
             @keydown.enter="addKey">
    </label>
    <label class="field">
      <span class="lab">备注（可选）</span>
      <input type="text" v-model="form.label" placeholder="例如：大号 / 小号2" maxlength="60">
    </label>
    <button class="btn primary" :disabled="adding" @click="addKey">{{ adding ? '接入中…' : '上传并接入' }}</button>
  </div>

  <div class="card">
    <h2>我的 Key 列表</h2>
    <table v-if="keys.length">
      <thead>
      <tr>
        <th>游戏账号</th>
        <th>备注</th>
        <th>Key</th>
        <th>状态</th>
        <th>最近 Tick</th>
        <th>说明</th>
        <th>隐私设置</th>
        <th style="width:180px">操作</th>
      </tr>
      </thead>
      <tbody>
      <tr v-for="k in keys" :key="k.id">
        <td>
          <span v-if="k.gameUsername">@{{ k.gameUsername }}</span>
          <span v-else style="color:var(--dim)">识别中…</span>
        </td>
        <td>{{ k.label || '' }}</td>
        <td style="font-family:var(--mono)">{{ k.masked }}</td>
        <td>
          <span v-if="k.status === 'ENABLED'" class="dot" :class="k.online ? 'on' : 'off'"></span>
          <span class="status-pill" :class="statusClass(k)">{{ statusText(k) }}</span>
        </td>
        <td style="font-family:var(--mono)">{{ k.lastSeenTick ?? '-' }}</td>
        <td style="color:var(--dim);font-size:12px">{{ k.lastError || '' }}</td>
        <td>
          <div class="privacy-options">
            <label>
              <input type="checkbox" :checked="k.showCoreOnMap" :disabled="k.saving"
                     @change="setPrivacy(k, 'showCoreOnMap', $event.target.checked)">向其他成员显示核心
            </label>
            <label>
              <input type="checkbox" :checked="k.rosterIdsOnly" :disabled="k.saving"
                     @change="setPrivacy(k, 'rosterIdsOnly', $event.target.checked)">盟友接口仅返回对象 ID
            </label>
          </div>
        </td>
        <td>
          <button v-if="k.status === 'ENABLED'" class="btn sm" @click="toggle(k, 'disable')">停用</button>
          <button v-else class="btn sm" @click="toggle(k, 'enable')">启用</button>
          <button class="btn sm danger" @click="del(k)">删除</button>
        </td>
      </tr>
      </tbody>
    </table>
    <div v-else style="color:var(--dim);text-align:center;padding:28px">还没有上传任何 key</div>
  </div>
</div>
<script src="/js/vendor/vue.global.prod.js?v=terrain-v1"></script>
<script src="/js/api.js?v=terrain-v1"></script>
<script src="/js/nav.js?v=terrain-v1"></script>
<script>
  (async function () {
    let me;
    try { me = await ensureLogin(); } catch (e) { return; }
    renderTopbar('keys', me);
    if (new URLSearchParams(location.search).get('required') === 'map') {
      toast('请先上传一个游戏 Key，再访问联盟地图', true);
    }
    try {
      const cfg = await api('/api/auth/config');
      setAllianceName(cfg.allianceName);
      document.title = '我的 Key · ' + cfg.allianceName;
    } catch (e) { }

    const STATUS_MAP = {
      ENABLED: ['已启用', 'on'], DISABLED: ['已停用', ''],
      INVALID: ['凭证失效', 'err'], DUPLICATE: ['重复账号', 'warn']
    };

    Vue.createApp({
      setup() {
        const keys = Vue.ref([]);
        const form = Vue.reactive({ token: '', label: '' });
        const adding = Vue.ref(false);

        async function refresh() {
          try {
            keys.value = await api('/api/keys');
          } catch (e) { }
        }

        async function addKey() {
          const token = form.token.trim();
          if (!token) { toast('请粘贴 apikey', true); return; }
          adding.value = true;
          try {
            await api('/api/keys', {
              method: 'POST',
              body: JSON.stringify({ token, label: form.label.trim() })
            });
            form.token = '';
            form.label = '';
            toast('已上传，正在接入游戏…');
            await refresh();
          } catch (e) {
            toast(e.message, true);
          } finally {
            adding.value = false;
          }
        }

        async function toggle(k, act) {
          try {
            await api('/api/keys/' + k.id + '/' + act, { method: 'POST' });
            toast('操作成功');
            await refresh();
          } catch (e) {
            toast(e.message, true);
          }
        }

        async function del(k) {
          if (!confirm('确定删除该 key？')) return;
          try {
            await api('/api/keys/' + k.id, { method: 'DELETE' });
            toast('已删除');
            await refresh();
          } catch (e) {
            toast(e.message, true);
          }
        }

        async function setPrivacy(k, field, value) {
          k.saving = true;
          const payload = {
            showCoreOnMap: k.showCoreOnMap,
            rosterIdsOnly: k.rosterIdsOnly,
            [field]: value
          };
          try {
            await api('/api/keys/' + k.id + '/privacy', {
              method: 'POST', body: JSON.stringify(payload)
            });
            toast('隐私设置已更新');
          } catch (e) {
            toast(e.message, true);
          }
          await refresh();
        }

        refresh();
        setInterval(refresh, 8000);

        return {
          keys, form, adding,
          addKey, toggle, del, setPrivacy,
          statusText: k => (STATUS_MAP[k.status] || [k.status])[0],
          statusClass: k => (STATUS_MAP[k.status] || ['', ''])[1]
        };
      }
    }).mount('#app');
  })();
</script>
</body>
</html>
