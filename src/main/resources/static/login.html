<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · Arena 联盟</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="emblem">⚔</div>
    <h1 id="alliance-name">Arena 联盟指挥中心</h1>
    <div class="sub">全联盟实时地图 · 内部攻击拦截 · 自动执法</div>
    <div class="error" id="error-box" style="display:none"></div>
    <button class="linuxdo-btn" id="linuxdo-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#1c1c1c"/>
        <path d="M7 15.5v-7l5 3.5-5 3.5z" fill="#ffb003"/>
        <rect x="13.5" y="8" width="2.2" height="8" rx="1" fill="#ffb003"/>
      </svg>
      使用 LinuxDo 登录
    </button>
    <div style="display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--dim);font-size:12px">
      <span style="flex:1;height:1px;background:var(--border)"></span>或使用账号密码
      <span style="flex:1;height:1px;background:var(--border)"></span>
    </div>
    <label class="field" style="text-align:left;margin-bottom:10px">
      <input type="text" id="pw-user" placeholder="用户名" autocomplete="username">
    </label>
    <label class="field" style="text-align:left;margin-bottom:14px">
      <input type="password" id="pw-pass" placeholder="密码" autocomplete="current-password">
    </label>
    <div style="display:flex;gap:10px">
      <button class="btn primary" id="btn-pw-login" style="flex:1">登录</button>
      <button class="btn" id="btn-pw-register" style="flex:1;display:none">注册</button>
    </div>
    <div id="dev-login" style="display:none;margin-top:14px">
      <label class="field" style="text-align:left">
        <span class="lab">开发登录（本地调试）</span>
        <input type="text" id="dev-name" placeholder="输入用户名回车登录">
      </label>
    </div>
    <div class="tip">
      首位登录/注册者自动成为联盟管理员<br>
      登录后可上传游戏 apikey 加入联盟保护
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
  (async function () {
    const params = new URLSearchParams(location.search);
    const error = params.get('error');
    if (error) {
      const box = $id('error-box');
      box.textContent = error;
      box.style.display = 'block';
    }
    try {
      const me = await api('/api/auth/me');
      if (me.loggedIn) { location.href = '/'; return; }
    } catch (e) { }
    try {
      const cfg = await api('/api/auth/config');
      if (cfg.allianceName) {
        $id('alliance-name').textContent = cfg.allianceName;
        document.title = '登录 · ' + cfg.allianceName;
      }
      if (!cfg.registrationOpen) {
        $id('error-box').textContent = '联盟当前未开放注册（已有成员仍可登录）';
        $id('error-box').style.display = 'block';
      }
      if (cfg.devLoginEnabled) {
        $id('dev-login').style.display = 'block';
        $id('dev-name').addEventListener('keydown', e => {
          if (e.key === 'Enter' && e.target.value.trim()) {
            location.href = '/api/auth/dev-login?u=' + encodeURIComponent(e.target.value.trim());
          }
        });
      }
      if (cfg.passwordRegisterEnabled) {
        $id('btn-pw-register').style.display = '';
      }
      if (!cfg.linuxdoConfigured) {
        const btn = $id('linuxdo-btn');
        btn.disabled = true;
        btn.style.opacity = .55;
        btn.title = '管理员尚未配置 LinuxDo OAuth（LINUXDO_CLIENT_ID / LINUXDO_CLIENT_SECRET）';
      }
    } catch (e) { }
    $id('linuxdo-btn').onclick = () => location.href = '/api/auth/linuxdo/authorize';

    function showError(msg) {
      const box = $id('error-box');
      box.textContent = msg;
      box.style.display = 'block';
    }
    async function passwordAuth(path) {
      const username = $id('pw-user').value.trim();
      const password = $id('pw-pass').value;
      if (!username || !password) { showError('请输入用户名和密码'); return; }
      try {
        await api('/api/auth/' + path, { method: 'POST', body: JSON.stringify({ username, password }) });
        location.href = '/';
      } catch (e) {
        showError(e.message);
      }
    }
    $id('btn-pw-login').onclick = () => passwordAuth('login');
    $id('btn-pw-register').onclick = () => passwordAuth('register');
    $id('pw-pass').addEventListener('keydown', e => { if (e.key === 'Enter') passwordAuth('login'); });
  })();
</script>
</body>
</html>
